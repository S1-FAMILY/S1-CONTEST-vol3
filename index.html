<!-- Фон: аврора, ледяная рамка, снегопад -->
<div class="aurora" aria-hidden="true"></div>
<div class="ice-frame" aria-hidden="true"><div class="ice-img"></div></div>
<canvas id="snow-back" aria-hidden="true"></canvas>
<canvas id="snow-front" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="iceText" x="-4%" y="-12%" width="108%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".6" specularExponent="26" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0"/>
    </filter>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2faff" stop-opacity=".96"/>
      <stop offset=".16" stop-color="#c9e4f7" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#5b8fbb" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0a182a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iceHeart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#b9d8ee"/>
      <stop offset="1" stop-color="#6f9ec0"/>
    </linearGradient>
  </defs>
</svg>
